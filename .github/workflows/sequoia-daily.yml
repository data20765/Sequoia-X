name: Sequoia-X 每日选股

# 收盘后跑：工作日 18:15 北京时间（10:15 UTC）。数据库用 actions/cache
# 在各次运行间传递；首次运行（或缓存丢失）时自动回填历史数据。
on:
  schedule:
    - cron: "15 10 * * 1-5"
  workflow_dispatch:
    inputs:
      force_backfill:
        description: "强制重新回填历史数据"
        type: boolean
        default: false

concurrency:
  group: sequoia-daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # 用户没有飞书机器人：占位地址，推送失败只记日志，不影响选股；
      # 选股结果以 results/*.json 形式随 artifact 下载。
      FEISHU_WEBHOOK_URL: https://open.feishu.cn/open-apis/bot/v2/hook/placeholder-disabled
      DB_PATH: data/sequoia_v2.db
      START_DATE: "2024-01-01"
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          pip install uv
          uv sync

      - name: 恢复数据库缓存
        uses: actions/cache@v4
        with:
          path: data/sequoia_v2.db
          key: sequoia-db-${{ github.run_id }}
          restore-keys: |
            sequoia-db-

      - name: 回填历史数据（强制）
        if: ${{ inputs.force_backfill == true }}
        run: .venv/bin/python -u main.py --backfill

      - name: 回填历史数据（数据库缺失时自动）
        if: ${{ inputs.force_backfill != true }}
        run: |
          if [ ! -s data/sequoia_v2.db ]; then
            echo "数据库不存在，开始回填"
            .venv/bin/python -u main.py --backfill
          else
            echo "数据库已存在，跳过回填"
          fi

      - name: 日常选股
        run: .venv/bin/python -u main.py 2>&1 | tee sequoia_run.log

      - name: 保存数据库缓存
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/sequoia_v2.db
          key: sequoia-db-${{ github.run_id }}

      - name: 上传选股结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sequoia-results-${{ github.run_number }}
          path: |
            results/
            sequoia_run.log
          if-no-files-found: warn
